[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alkem-core"
version = "0.1.0"
description = "Minimal ALKEM application layer for configured AI generation."
requires-python = ">=3.11"
dependencies = [
    "ai-provider-gateway>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
