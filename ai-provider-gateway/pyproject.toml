[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-provider-gateway"
version = "0.1.0"
description = "A single, provider-agnostic interface for OpenAI, Anthropic, Ollama, and Azure OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]
keywords = ["llm", "ai", "openai", "anthropic", "ollama", "hexagonal-architecture", "ports-and-adapters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/ai-provider-gateway"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/ai-provider-gateway"

[tool.setuptools.packages.find]
where = ["src"]
