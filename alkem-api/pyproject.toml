[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alkem-api"
version = "0.1.0"
description = "HTTP adapter for the ALKEM applied AI backend."
requires-python = ">=3.11"
dependencies = [
    "alkem-core>=0.1.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
